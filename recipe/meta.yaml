{% set name = "pyemd" %}
{% set version = "0.5.1" %}
{% set sha256sum = "fc81c2116f8573e559dfbb8d73e03d9f73c22d0770559f406516984302e07e70" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256sum }}

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python
    - setuptools
    - wheel
    - pip
    - numpy   1.19  # [py<310]
    - numpy   1.21  # [py==310]
    - numpy   1.23  # [py>=311]
    # see https://github.com/wmayner/pyemd/issues/59
    - cython  0.29.33  # [py>=311]


  build:
    - {{ compiler('cxx') }}

  run:
    - python
    - {{ pin_compatible('numpy') }}

test:
  requires:
    - pytest
    - pip
  imports:
    - pyemd
  source_files:
    - test/
  commands:
    - pytest -v test/
    - pip check

about:
  home: https://github.com/wmayner/pyemd
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: A Python wrapper for the Earth Mover's Distance.
  description: |
    PyEMD is a Python wrapper for Ofir Pele and Michael Werman’s implementation
    of the Earth Mover’s Distance that allows it to be used with NumPy.
  doc_url: https://github.com/wmayner/pyemd
  dev_url: https://github.com/wmayner/pyemd

extra:
  recipe-maintainers:
    - rmax
